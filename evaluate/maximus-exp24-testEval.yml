ops: [evaluate]

model: {
    path: /nfsd/bcb/bcbg/EleonoraSignor/sei-framework/model/sei.py,
    class: Sei,
    class_args: {
        sequence_length: 4096,
        n_genomic_features: 89,
    }
}

sampler: !obj:selene_sdk.samplers.RandomPositionsSampler {
    target_path: /nfsd/bcb/bcbg/EleonoraSignor/sei-framework/train/data/data_scophthalmus_maximus/peaks/scophthalmus_maximus_sorted_atac_chip-seq_chrs1_22.bed.gz,
    reference_sequence: !obj:selene_sdk.sequences.Genome {
        input_path: /nfsd/bcb/bcbg/EleonoraSignor/sei-framework/resources/maximus_UCSC.fa
    },
    features: !obj:selene_sdk.utils.load_features_list {
        input_path: /nfsd/bcb/bcbg/EleonoraSignor/sei-framework/train/data/data_scophthalmus_maximus/peaks/cromatine_profiles_maximus.txt
    },
    sequence_length: 4096,
    center_bin_to_predict: [2048, 2049],
    validation_holdout: [19, 20, 21, 22],

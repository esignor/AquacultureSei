}

evaluate_model: !obj:selene_sdk.EvaluateModel {
    trained_model_path: /nfsd/bcb/bcbg/EleonoraSignor/sei-framework/train/models/maximus/exp24/2025-07-28-18-14-22-49O0AJUM/best_model.pth.tar,
    features: !obj:selene_sdk.utils.load_features_list {
